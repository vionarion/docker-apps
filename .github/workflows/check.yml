name: check

on:
  push:
  pull_request:

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every docker-compose file
        run: |
          docker network create proxy
          for f in $(find . -name 'docker-compose.yml' -o -name 'compose.yaml'); do
            dir=$(dirname "$f")
            for ex in "$dir"/*.example "$dir"/.env.example; do
              if [ -f "$ex" ]; then cp "$ex" "${ex%.example}"; fi
            done
            echo "== $f"
            docker compose -f "$f" config -q
          done

  monitoring-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool, amtool and loki config checks
        working-directory: apps/monitoring
        run: |
          docker run --rm -v "$PWD/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v3.15.1 check config /p/prometheus.yml
          echo -n dummy > alertmanager/telegram_token
          docker run --rm -v "$PWD/alertmanager:/etc/alertmanager:ro" --entrypoint amtool prom/alertmanager:v0.34.2 check-config /etc/alertmanager/alertmanager.yml
          docker run --rm -v "$PWD/loki/config.yaml:/etc/loki/config.yaml:ro" grafana/loki:3.7.9 -config.file=/etc/loki/config.yaml -verify-config

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
