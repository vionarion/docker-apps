route:
  receiver: telegram
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      # Bot token is read from a file that is not in git (see README)
      - bot_token_file: /etc/alertmanager/telegram_token
        chat_id: 123456789 # replace with your chat id
        parse_mode: HTML
