services:
  wordpress:
    image: wordpress:6.8.3-php8.3-apache
    container_name: wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', false);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - wordpress-data:/var/www/html
    networks: [proxy, internal]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.wordpress.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.wordpress.entrypoints=websecure
      - traefik.http.routers.wordpress.tls.certresolver=letsencrypt
      - traefik.http.services.wordpress.loadbalancer.server.port=80
      - docker-volume-backup.stop-during-backup=false
    deploy:
      resources:
        limits:
          memory: 512m

  db:
    image: mysql:9.2.0
    container_name: wordpress-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --innodb-buffer-pool-size=256M --max-connections=100
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [internal]
    labels:
      - docker-volume-backup.stop-during-backup=true
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768m

  backup:
    image: offen/docker-volume-backup:v2
    container_name: wordpress-backup
    restart: unless-stopped
    env_file: ./backup.env
    volumes:
      - wordpress-data:/backup/wordpress-data:ro
      - mysql-data:/backup/mysql-data:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  wordpress-data:
  mysql-data:

networks:
  proxy:
    external: true
  internal:
