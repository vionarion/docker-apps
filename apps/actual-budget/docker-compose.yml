services:
  actual:
    image: actualbudget/actual-server:26.10.0
    container_name: actual-budget
    restart: unless-stopped
    environment:
      ACTUAL_LOGIN_METHOD: password
      ACTUAL_PORT: 5006
      ACTUAL_TRUSTED_PROXIES: 172.16.0.0/12
      ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB: 20
      ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB: 50
      ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB: 20
    volumes:
      - actual-data:/data
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.actual.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.actual.entrypoints=websecure
      - traefik.http.routers.actual.tls.certresolver=letsencrypt
      - traefik.http.services.actual.loadbalancer.server.port=5006
      - docker-volume-backup.stop-during-backup=actual-budget
    healthcheck:
      test: ["CMD-SHELL", "node src/scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256m

  backup:
    image: offen/docker-volume-backup:v2
    container_name: actual-backup
    restart: unless-stopped
    env_file: ./backup.env
    volumes:
      - actual-data:/backup/actual-data:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  actual-data:

networks:
  proxy:
    external: true
