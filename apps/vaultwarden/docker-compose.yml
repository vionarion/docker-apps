services:
  vaultwarden:
    image: vaultwarden/server:1.37.4-alpine
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: https://${APP_DOMAIN}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SIGNUPS_ALLOWED: "false"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_PORT: 587
      SMTP_SECURITY: starttls
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      PUSH_ENABLED: "true"
      PUSH_INSTALLATION_ID: ${PUSH_INSTALLATION_ID}
      PUSH_INSTALLATION_KEY: ${PUSH_INSTALLATION_KEY}
    volumes:
      - vaultwarden-data:/data
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.vaultwarden.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.vaultwarden.entrypoints=websecure
      - traefik.http.routers.vaultwarden.tls.certresolver=letsencrypt
      - traefik.http.services.vaultwarden.loadbalancer.server.port=80
      - docker-volume-backup.stop-during-backup=false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 256m

  backup:
    image: offen/docker-volume-backup:v2
    container_name: vaultwarden-backup
    restart: unless-stopped
    env_file: ./backup.env
    volumes:
      - vaultwarden-data:/backup/vaultwarden-data:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  vaultwarden-data:

networks:
  proxy:
    external: true
